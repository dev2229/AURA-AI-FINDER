<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Finder - Professional Intelligence Directory</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  
  <script>
    // Critical Shim: Prevents crashes in SDKs that expect Node-like process global
    window.process = { 
      env: { 
        NODE_ENV: 'production',
        API_KEY: '' // Will be populated by platform
      } 
    };
  </script>

  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19?dev",
    "react-dom": "https://esm.sh/react-dom@19?dev",
    "react-dom/client": "https://esm.sh/react-dom@19/client?dev",
    "react-router-dom": "https://esm.sh/react-router-dom@6",

  <style>
    :root { 
      --bg-dark: #020203; 
      --accent-pink: #ff2d55; 
      --card-bg: rgba(10, 10, 12, 0.7);
    }
    body { 
      font-family: 'Inter', sans-serif; 
      background-color: var(--bg-dark); 
      color: #f8fafc; 
      overflow-x: hidden; 
      margin: 0;
    }
    .tech-font { font-family: 'JetBrains Mono', monospace; }
    .glass { background: var(--card-bg); backdrop-filter: blur(24px); border: 1px solid rgba(255, 255, 255, 0.05); }
    .neon-pink-text { color: var(--accent-pink); text-shadow: 0 0 15px rgba(255, 45, 85, 0.4); }
    .orb { position: absolute; border-radius: 50%; filter: blur(120px); z-index: -1; pointer-events: none; opacity: 0.15; }
    .animate-float { animation: float 20s ease-in-out infinite; }
    @keyframes float { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(30px, -30px); } }
    
    /* Scanline effect */
    .hero-scanline::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
      z-index: 20;
      background-size: 100% 2px, 3px 100%;
      pointer-events: none;
      opacity: 0.1;
    }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #000; }
    ::-webkit-scrollbar-thumb { background: #1a1a1a; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--accent-pink); }
  </style>
</head>
<body class="hero-scanline">
  <div id="root"></div>
  <script type="module" src="./index.tsx"></script>
</body>
</html>
